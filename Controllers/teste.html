<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Teste - Back-end Fila</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; margin: 5px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-verde { background: #28a745; }
        .btn-azul { background: #007bff; }
        .btn-laranja { background: #fd7e14; }
        .btn-vermelho { background: #dc3545; }
        .tela-tv { background: #222; color: #0f0; padding: 20px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 24px; text-align: left; }
        .controles { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Teste (Back-end)</h2>
    
    <div class="controles">
        <button class="btn-verde" onclick="gerarSenha()">1. Gerar Senha (POST)</button>
        <button class="btn-azul" onclick="chamarSenha()">2. Chamar Senha (POST)</button>
        <button class="btn-laranja" onclick="avancarEtapa()">3. Avançar Etapa (POST)</button>
        <button class="btn-vermelho" onclick="zerarTeste()">Zerar (Reload)</button>
    </div>

    <div class="tela-tv" id="tela">
        Aguardando ações...
    </div>
</div>

<script>
    const API_URL = "http://localhost:5000/api/senhas";
    let senhaAtualId = null;

    async function gerarSenha() {
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filaId: 1, servicoId: 1 })
            });
            const data = await res.json();
            senhaAtualId = data.id;
            document.getElementById("tela").innerHTML = `Senha Gerada!<br><br>ID: ${data.id}<br>Número: ${data.numero}<br>Status: aguardando`;
        } catch (e) {
            document.getElementById("tela").innerHTML = "Erro ao gerar senha.";
        }
    }

    async function chamarSenha() {
        if (!senhaAtualId) return document.getElementById("tela").innerHTML = "Gere uma senha primeiro!";
        try {
            await fetch(`${API_URL}/${senhaAtualId}/chamar`, { method: "POST" });
            atualizarTela();
        } catch (e) {
            document.getElementById("tela").innerHTML = "Erro ao chamar.";
        }
    }

    async function avancarEtapa() {
        if (!senhaAtualId) return document.getElementById("tela").innerHTML = "Gere e chame uma senha primeiro!";
        try {
            const res = await fetch(`${API_URL}/${senhaAtualId}/avancar`, { method: "POST" });
            const data = await res.json();
            if (data.finalizada) {
                document.getElementById("tela").innerHTML = `Senha ${senhaAtualId}<br><br>FINALIZADA!`;
                senhaAtualId = null;
            } else {
                atualizarTela();
            }
        } catch (e) {
            document.getElementById("tela").innerHTML = "Erro ao avançar.";
        }
    }

    async function atualizarTela() {
        try {
            // Busca a chamada atual da API para exibir a etapa
            const res = await fetch(`${API_URL}/chamada-atual`);
            const s = await res.json();
            if (s) {
                document.getElementById("tela").innerHTML = `
                    <div style="font-size: 40px; color: yellow;">${s.numero}</div>
                    Cliente: ${s.clienteNome || 'Sem cadastro'}<br>
                    Serviço: ${s.servicoNome}<br>
                    Fila: ${s.filaNome}<br>
                    Etapa Atual: <span style="color: cyan;">${s.etapaNome || 'Recepção'}</span><br>
                    Status: ${s.status}
                `;
            } else {
                document.getElementById("tela").innerHTML = "Nenhuma senha chamada.";
            }
        } catch (e) {
            document.getElementById("tela").innerHTML = "Erro ao buscar dados.";
        }
    }

    function zerarTeste() {
        location.reload();
    }
</script>

</body>
</html>
